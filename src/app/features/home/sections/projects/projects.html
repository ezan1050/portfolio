<section id="projects" appScrollReveal class="max-w-5xl mx-auto px-6 py-20">

  <h2 class="font-display text-3xl md:text-4xl font-bold text-cyber-text mb-2">
    Projects
  </h2>
  <p class="font-mono text-cyber-cyan text-sm mb-10">
    // things I've built
  </p>

  <div class="grid gap-6 md:grid-cols-2">

    @for (project of projectList; track project.slug) {
      <div class="bg-cyber-surface/50 border border-cyber-cyan/15 rounded-xl p-6 flex flex-col">

        <h3 class="font-display text-xl text-cyber-text mb-2">
          {{ project.name }}
        </h3>

        <p class="font-body text-sm text-cyber-muted mb-4 flex-grow">
          {{ project.shortDescription }}
        </p>

        <div class="flex flex-wrap gap-2 mb-5">
          @for (tech of project.technologies; track tech) {
            <span class="font-mono text-xs text-cyber-muted bg-cyber-bg border border-cyber-cyan/20 rounded-md px-2 py-1">
              {{ tech }}
            </span>
          }
        </div>

        <div class="flex gap-4 font-mono text-sm">
          <a [href]="project.githubUrl" target="_blank" rel="noopener noreferrer"
             class="text-cyber-cyan hover:underline">
            GitHub
          </a>
          @if (project.liveUrl) {
            <a [href]="project.liveUrl" target="_blank" rel="noopener noreferrer"
               class="text-cyber-cyan hover:underline">
              Live Demo
            </a>
          }
        </div>

      </div>
    }

  </div>

</section>
