<section id="skills" appScrollReveal class="max-w-5xl mx-auto px-6 py-20">

  <h2 class="font-display text-3xl md:text-4xl font-bold text-cyber-text mb-2">
    Skills
  </h2>
  <p class="font-mono text-cyber-cyan text-sm mb-10">
    // technologies & tools
  </p>

  <div class="grid gap-6 md:grid-cols-2">

    @for (category of categories; track category.name) {
      <div class="bg-cyber-surface/50 border border-cyber-cyan/15 rounded-xl p-6">
        <h3 class="font-display text-xl text-cyber-cyan mb-4">
          {{ category.name }}
        </h3>
        <div class="flex flex-wrap gap-2">
          @for (tech of category.technologies; track tech) {
            <span class="font-mono text-sm text-cyber-muted bg-cyber-bg border border-cyber-cyan/20 rounded-md px-3 py-1">
              {{ tech }}
            </span>
          }
        </div>
      </div>
    }

  </div>

</section>
